# Built-in AT keyboard: thumb modifiers and typing-protected A/Control.
[ids]
0001:0001:3cf016cc

[global]
overload_tap_timeout = 200

[main]
katakanahiragana = overload(hyper, enter)
henkan = overload(shift, backspace)
muhenkan = overload(shift, muhenkan)
# Recent typing keeps A literal; otherwise require a full 250 ms hold for Ctrl.
# Unlike overloadt2/lettermod, quick intervening taps do not force Control.
a = overloadi(a, overloadt(control, a, 250), 200)

include hyper
