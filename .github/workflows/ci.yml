name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: |
          for script in apply.sh rollback.sh home/.local/bin/* tests/*.sh; do
            IFS= read -r shebang < "$script"
            case "$shebang" in *bash*) bash -n "$script" ;; esac
          done
          python3 -m py_compile merge-shell-config.py home/.local/bin/hypr-auto-rotate tests/test_shell_merge.py

      - name: Shellcheck
        run: |
          for script in apply.sh rollback.sh home/.local/bin/* tests/*.sh; do
            IFS= read -r shebang < "$script"
            case "$shebang" in *bash*) shellcheck -S warning "$script" ;; esac
          done

      - name: Tests
        run: |
          bash tests/run.sh
